<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Required meta tags always come first -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
     <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->

    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="../../favicon.ico">

    <title>Austin Booker</title>

    <!-- Load all CSS files -->
    <script src="js/load-styles.js"></script>
</head>

<body>
 
<div id="nav-placeholder"></div>

<div id="wrapper">

    <!--Page Content-->  
      <div id="page-content-wrapper">
          <div class="container-fluid">
                <div class="row">
                    <div class="col-lg-12 nopadding">
  <script src="js/siteLinks.js"></script>
  <script src="js/gridBuilder.js"></script>  <!-- Changed from galleryBuilder.js -->
  <ul class="grid"></ul>  <!-- Uses .grid class -->
            </div>
                </div>
          </div>        
      </div>

</div>

    <!-- jQuery first, then Bootstrap JS. -->
    <script src="https://ajax.googleapis.com/libs/jquery/2.1.4/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-alpha.2/js/bootstrap.min.js"></script>

    <script>
      fetch('nav.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('nav-placeholder').innerHTML = data;
          var script = document.createElement('script');
          script.src = 'js/siteLinks.js';
          script.onload = function() {
            var sidebarScript = document.createElement('script');
            sidebarScript.src = 'js/sidebarLinks.js';
            document.body.appendChild(sidebarScript);
          };
          document.body.appendChild(script);
        });
    </script>

</body>

</html>
